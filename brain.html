<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Atlas · Second Brain — live galaxy of everything I know</title>
<style>
:root {
  --cr:  #F2EDE4;
  --ink: #1A1714;
  --wdark: #0A0908;
  --sig: #FF4713;
  --grey:#8C8782;
  --ri: rgba(242,237,228,0.10);
  --dim: rgba(242,237,228,0.55);
  --f: "Helvetica Neue","Arial",system-ui,sans-serif;
  --fm: "SF Mono","Fira Mono","Courier New",monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100vh;overflow:hidden;background:var(--wdark);
  font-family:var(--f);-webkit-font-smoothing:antialiased;color:var(--cr);user-select:none;
  -webkit-tap-highlight-color:transparent}

/* ── SCENE CONTAINER ── */
#scene{position:fixed;inset:0;z-index:0}
#scene canvas{display:block !important}

/* ── HEADER ── */
#back{position:fixed;top:14px;left:20px;z-index:200;font-family:var(--fm);font-size:10px;
  letter-spacing:.08em;color:rgba(242,237,228,.55);text-decoration:none;text-transform:uppercase;
  padding:3px 0;border-bottom:1px solid transparent;transition:color 120ms,border-color 120ms;
  mix-blend-mode:screen}
#back:hover{color:var(--cr);border-bottom-color:var(--cr)}

#head{position:fixed;top:0;left:0;right:0;z-index:150;padding:12px 20px 10px;
  background:linear-gradient(180deg,rgba(10,9,8,.85) 0%,rgba(10,9,8,.4) 60%,transparent 100%);
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-left:120px;
  pointer-events:none}
#head > *{pointer-events:auto}
#head .lbl{font-family:var(--fm);font-size:10px;letter-spacing:.16em;color:rgba(242,237,228,.4);text-transform:uppercase}
#head h1{font-size:clamp(15px, 2.5vw, 20px);font-weight:800;letter-spacing:-.02em;color:var(--cr);line-height:1.15}
#head h1 span{color:var(--sig)}
#head .meta{font-family:var(--fm);font-size:10px;color:rgba(242,237,228,.5);letter-spacing:.06em;text-align:right}

/* ── SEARCH ── */
#search{position:fixed;top:60px;left:20px;z-index:150;background:rgba(10,9,8,.6);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(242,237,228,.12);color:var(--cr);
  padding:8px 12px;font-family:var(--fm);font-size:11px;letter-spacing:.04em;
  width:280px;max-width:calc(100% - 40px);outline:none}
#search:focus{border-color:var(--sig)}
#search::placeholder{color:rgba(242,237,228,.35)}

/* ── FILTERS ── */
#filters{position:fixed;top:100px;left:20px;z-index:150;display:flex;gap:5px;flex-wrap:wrap;
  max-width:calc(100% - 40px)}
.filt{padding:3px 8px;border:1px solid rgba(242,237,228,.15);background:rgba(10,9,8,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  font-family:var(--fm);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(242,237,228,.5);cursor:pointer;transition:all 120ms}
.filt:hover{border-color:rgba(242,237,228,.4);color:var(--cr)}
.filt.on{background:var(--sig);color:#000;border-color:var(--sig)}

/* ── LEGEND ── */
#leg{position:fixed;bottom:16px;left:20px;z-index:120;font-family:var(--fm);
  font-size:9px;color:rgba(242,237,228,.55);letter-spacing:.05em;display:flex;
  gap:12px;flex-wrap:wrap;max-width:calc(100% - 240px);
  background:rgba(10,9,8,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:6px 10px;border:1px solid rgba(242,237,228,.08)}
#leg .item{display:flex;align-items:center;gap:5px}
#leg .sw{width:8px;height:8px;border-radius:50%}

/* ── STATS ── */
#stats{position:fixed;bottom:16px;right:20px;z-index:120;font-family:var(--fm);
  font-size:9px;color:rgba(242,237,228,.4);letter-spacing:.05em;text-align:right;
  background:rgba(10,9,8,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding:6px 10px;border:1px solid rgba(242,237,228,.08);line-height:1.5}
#stats b{color:var(--sig);font-weight:400}

/* ── SIDE PANEL ── */
#panel{position:fixed;top:0;right:0;height:100%;width:min(400px, 92vw);
  background:rgba(10,9,8,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--cr);z-index:400;
  transform:translateX(100%);transition:transform 320ms cubic-bezier(0.16,1,0.3,1);
  padding:56px 24px 24px;display:flex;flex-direction:column;overflow:hidden;
  border-left:1px solid rgba(242,237,228,.1)}
#panel.on{transform:translateX(0)}
#panel .close{position:absolute;top:14px;right:14px;background:transparent;border:1px solid rgba(242,237,228,.15);
  color:var(--cr);width:28px;height:28px;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:border-color 120ms}
#panel .close:hover{border-color:var(--sig)}
#panel .kind{font-family:var(--fm);font-size:10px;letter-spacing:.16em;color:var(--sig);
  text-transform:uppercase;margin-bottom:8px}
#panel h2{font-size:clamp(18px, 3.5vw, 24px);font-weight:800;letter-spacing:-.02em;
  line-height:1.15;color:var(--cr);word-break:break-word}
#panel .meta-row{margin-top:16px;padding-top:12px;border-top:1px solid rgba(242,237,228,.08);
  font-family:var(--fm);font-size:10px;color:rgba(242,237,228,.5);letter-spacing:.04em;line-height:1.7}
#panel .meta-row div{display:flex;justify-content:space-between;gap:10px}
#panel .meta-row .k{color:rgba(242,237,228,.35)}
#panel .meta-row .v{color:var(--cr)}
#panel .neighbors{margin-top:18px;flex:1;overflow-y:auto;padding-right:6px}
#panel .neighbors h3{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:rgba(242,237,228,.4);
  text-transform:uppercase;margin-bottom:10px}
#panel .n-chip{display:inline-block;padding:3px 8px;border:1px solid rgba(242,237,228,.14);
  font-size:11px;color:var(--cr);margin:0 4px 5px 0;cursor:pointer;transition:all 120ms}
#panel .n-chip:hover{border-color:var(--sig);color:var(--sig)}

/* ── LOADING ── */
#load{position:fixed;inset:0;background:var(--wdark);z-index:900;display:flex;
  flex-direction:column;align-items:center;justify-content:center;transition:opacity 400ms;gap:14px}
#load.gone{opacity:0;pointer-events:none}
#load .dot{width:8px;height:8px;background:var(--sig);border-radius:50%;animation:pulse 900ms ease-in-out infinite;box-shadow:0 0 24px rgba(255,71,19,.6)}
#load .lbl{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:rgba(242,237,228,.4);text-transform:uppercase}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.5);opacity:.4}}

/* ── HINT ── */
#hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:80;font-family:var(--fm);font-size:11px;color:rgba(242,237,228,.35);
  letter-spacing:.14em;text-transform:uppercase;pointer-events:none;
  transition:opacity 600ms;text-align:center}
#hint.gone{opacity:0}
#hint .k{color:var(--sig)}

/* ── MOBILE ── */
@media(max-width:768px){
  #head{padding:38px 12px 8px;flex-direction:column;align-items:flex-start;gap:4px;padding-left:12px}
  #head h1{font-size:14px}
  #head .meta{font-size:9px;text-align:left}
  #back{top:12px;left:12px;font-size:10px}
  #search{top:96px;left:12px;width:calc(100% - 24px);font-size:11px;padding:7px 10px}
  #filters{top:132px;left:12px;gap:4px;max-width:calc(100% - 24px)}
  .filt{padding:3px 7px;font-size:8.5px}
  #leg{bottom:10px;left:12px;font-size:8px;gap:8px;max-width:calc(100% - 130px);padding:5px 8px}
  #stats{bottom:38px;right:12px;font-size:8px;padding:5px 8px}
  #panel{width:100%;padding:44px 16px 16px}
  #panel h2{font-size:18px}
  #hint{font-size:9px;padding:0 20px}
}
</style>
</head>
<body>

<a href="deck.html" id="back">← Atlas deck</a>

<div id="head">
  <div>
    <div class="lbl">Atlas · Interactive</div>
    <h1>Second Brain <span>—</span> live galaxy of everything I know</h1>
  </div>
  <div class="meta" id="stat-meta">— nodes · — links</div>
</div>

<input id="search" type="text" placeholder="Search 1600+ notes…" autocomplete="off" spellcheck="false">

<div id="filters">
  <button class="filt on" data-f="all">ALL</button>
  <button class="filt" data-f="rollie">ROLLIE</button>
  <button class="filt" data-f="personal">PERSONAL</button>
  <button class="filt" data-f="skill">SKILLS</button>
  <button class="filt" data-f="mcp">MCPS</button>
  <button class="filt" data-f="project-active">ACTIVE</button>
  <button class="filt" data-f="concept">CONCEPTS</button>
  <button class="filt" data-f="doctrine">DOCTRINE</button>
</div>

<div id="scene"></div>

<div id="panel">
  <button class="close" onclick="clearSel()">×</button>
  <div class="kind" id="p-kind">—</div>
  <h2 id="p-title">—</h2>
  <div class="meta-row">
    <div><span class="k">Vault</span><span class="v" id="p-vault">—</span></div>
    <div><span class="k">Type</span><span class="v" id="p-type">—</span></div>
    <div><span class="k">Folder</span><span class="v" id="p-folder" style="text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis">—</span></div>
    <div><span class="k">Tags</span><span class="v" id="p-tags">—</span></div>
    <div><span class="k">Path</span><span class="v" id="p-path" style="font-size:9px;text-align:right;max-width:60%;overflow-wrap:anywhere">—</span></div>
  </div>
  <div class="neighbors">
    <h3>Connected notes</h3>
    <div id="p-neighbors">—</div>
  </div>
</div>

<div id="leg">
  <span class="item"><span class="sw" style="background:#FF4713"></span>Active project</span>
  <span class="item"><span class="sw" style="background:#F2EDE4"></span>Skill</span>
  <span class="item"><span class="sw" style="background:#7EE7FF"></span>MCP</span>
  <span class="item"><span class="sw" style="background:#F2D08C"></span>Doctrine</span>
  <span class="item"><span class="sw" style="background:#B8E3B8"></span>Concept</span>
  <span class="item"><span class="sw" style="background:#E5B8DE"></span>Entity</span>
</div>

<div id="stats">
  <span>updated <b id="stat-date">—</b></span><br>
  <span id="stat-line">— · —</span>
</div>

<div id="hint">
  Drag to orbit · <span class="k">Scroll to zoom</span> · Click a node
</div>

<div id="load">
  <div class="dot"></div>
  <div class="lbl">assembling the galaxy…</div>
</div>

<!-- Use UMD script tags (single Three.js instance to avoid version mismatch with 3d-force-graph) -->
<script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>

<script>
// THREE and ForceGraph3D are globals from the UMD scripts above

// ── COLOUR MAP ─────────────────────────────────────────────
const TYPE_COLORS = {
  'project-active':   0xFF4713,   // signal orange (hot)
  'project-completed':0xF2EDE4,   // cream
  'archive':          0x504840,   // dim
  'doctrine':         0xF2D08C,   // warm yellow (bright)
  'atlas':            0xFFDAB0,   // warm cream (bright)
  'skill':            0xF2EDE4,   // cream (soft)
  'mcp':              0x7EE7FF,   // cyan
  'index':            0xFFB080,   // orange-cream
  'concept':          0xB8E3B8,   // muted green
  'entity':           0xE5B8DE,   // muted pink
  'insight':          0xFFECC0,   // warm cream (bright)
  'summary':          0x9DB8D8,   // dusty blue
  'synthesis':        0xFF9060,   // bright orange
  'decision':         0xC0A0FF,   // violet
  'reference':        0xB0B0B0,   // grey
  'area':             0xD4CEC7,   // rule grey (many)
  'resource':         0xA8B8C0,   // muted teal
  'wiki':             0xE0DAD2,   // near-cream
  'raw':              0x605040,   // dim brown
  'note':             0x807870,   // mid-grey
};

// bright / core types glow more
const BRIGHT_TYPES = new Set([
  'project-active','doctrine','atlas','synthesis','insight','decision','mcp','index'
]);

// ── LOAD DATA ──────────────────────────────────────────────
let RAW = null;
let GRAPH = null;
let CURRENT_FILTER = 'all';
let SEL = null;

fetch('brain-data.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => {
    RAW = data;
    document.getElementById('stat-meta').textContent =
      `${data.stats.total_nodes.toLocaleString()} nodes · ${data.stats.total_edges.toLocaleString()} links`;
    document.getElementById('stat-line').textContent =
      `${data.stats.total_nodes.toLocaleString()} nodes · ${data.stats.total_edges.toLocaleString()} links`;
    document.getElementById('stat-date').textContent = data.generated_at.slice(0, 10);
    initGraph();
  })
  .catch(err => {
    console.error('Failed to load brain-data.json:', err);
    document.getElementById('load').innerHTML =
      '<div class="lbl" style="color:#FF4713">graph data failed to load — retry?</div>';
  });

// ── GRAPH INIT ─────────────────────────────────────────────
function initGraph() {
  // Build ID lookup
  const nodeById = new Map();
  RAW.nodes.forEach(n => nodeById.set(n.id, n));
  // Filter edges to only include those with valid source/target
  const validEdges = RAW.edges.filter(e => nodeById.has(e.source) && nodeById.has(e.target));

  const gData = {
    nodes: RAW.nodes.map(n => ({ ...n })),
    links: validEdges.map(e => ({ source: e.source, target: e.target, type: e.type })),
  };

  const container = document.getElementById('scene');
  GRAPH = ForceGraph3D()(container)
    .graphData(gData)
    .backgroundColor('#050403')
    .nodeId('id')
    .nodeVal(n => n.size * n.size)  // radius ∝ sqrt(val)
    .nodeAutoColorBy(null)
    .nodeColor(n => `#${(TYPE_COLORS[n.type] ?? 0x807870).toString(16).padStart(6,'0')}`)
    .nodeOpacity(0.92)
    .nodeResolution(6)
    .nodeThreeObject(n => {
      // Custom sprite for glow — additive-blended billboard for each node
      const color = TYPE_COLORS[n.type] ?? 0x807870;
      const bright = BRIGHT_TYPES.has(n.type);
      const size = (n.size || 1) * (bright ? 5.2 : 3.4);
      const spriteMap = getGlowTexture();
      const material = new THREE.SpriteMaterial({
        map: spriteMap,
        color: color,
        transparent: true,
        opacity: bright ? 1.0 : 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const sprite = new THREE.Sprite(material);
      sprite.scale.set(size, size, 1);
      // Store node ref so filter/click can find it
      sprite.userData.node = n;
      return sprite;
    })
    .nodeThreeObjectExtend(false)
    .linkColor(l => 'rgba(242,237,228,0.08)')
    .linkOpacity(0.28)
    .linkWidth(0.4)
    .linkDirectionalParticles(0)
    .warmupTicks(80)
    .cooldownTicks(300)
    .d3AlphaDecay(0.028)
    .d3VelocityDecay(0.28)
    .onNodeClick(node => {
      showPanel(node);
      // Fly camera to it
      const dist = 140;
      const dr = 1 + dist / Math.hypot(node.x, node.y, node.z);
      GRAPH.cameraPosition(
        { x: node.x * dr, y: node.y * dr, z: node.z * dr },
        node,
        1000
      );
    })
    .onBackgroundClick(() => clearSel());

  // Fog for depth — additive-blend sprite stacking gives the bloom-like effect
  // without needing UnrealBloomPass (which caused a Three.js version conflict)
  GRAPH.scene().fog = new THREE.FogExp2(0x050403, 0.0022);

  // Camera auto-drift
  const controls = GRAPH.controls();
  if (controls) {
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;  // slow drift
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
  }

  // Hide loading + hint after warmup
  setTimeout(() => {
    document.getElementById('load').classList.add('gone');
    setTimeout(() => document.getElementById('load').remove(), 400);
  }, 1400);
  setTimeout(() => {
    document.getElementById('hint').classList.add('gone');
    setTimeout(() => document.getElementById('hint').remove(), 700);
  }, 5000);

  // Wire filters
  document.querySelectorAll('.filt').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.filt').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      CURRENT_FILTER = btn.dataset.f;
      applyFilter();
    };
  });

  // Wire search
  const searchEl = document.getElementById('search');
  searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    applySearch(q);
  });
}

// ── FILTER + SEARCH ────────────────────────────────────────
function applyFilter() {
  if (!GRAPH) return;
  const nodes = GRAPH.graphData().nodes;
  const showAll = CURRENT_FILTER === 'all';
  nodes.forEach(n => {
    let show = showAll;
    if (!show) {
      if (CURRENT_FILTER === 'rollie' || CURRENT_FILTER === 'personal') {
        show = n.vault === CURRENT_FILTER;
      } else {
        show = n.type === CURRENT_FILTER;
      }
    }
    setNodeVisibility(n, show);
  });
}

function applySearch(q) {
  if (!GRAPH) return;
  const nodes = GRAPH.graphData().nodes;
  if (!q) {
    applyFilter();
    return;
  }
  nodes.forEach(n => {
    const hay = (n.label + ' ' + n.folder + ' ' + (n.tags || []).join(' ')).toLowerCase();
    setNodeVisibility(n, hay.includes(q));
  });
}

function setNodeVisibility(node, visible) {
  if (!node.__threeObj) return;
  node.__threeObj.visible = visible;
  if (node.__threeObj.material) {
    node.__threeObj.material.opacity = visible
      ? (BRIGHT_TYPES.has(node.type) ? 0.95 : 0.75)
      : 0.02;
  }
}

// ── PANEL ──────────────────────────────────────────────────
function showPanel(node) {
  SEL = node;
  document.getElementById('p-kind').textContent =
    (node.type || 'note').replace(/-/g, ' ').toUpperCase();
  document.getElementById('p-title').textContent = node.label;
  document.getElementById('p-vault').textContent = node.vault;
  document.getElementById('p-type').textContent = node.type;
  document.getElementById('p-folder').textContent = node.folder || '/';
  document.getElementById('p-tags').textContent =
    (node.tags && node.tags.length) ? node.tags.slice(0, 6).join(' · ') : '—';
  document.getElementById('p-path').textContent =
    node.id.split('::')[1] || node.id;

  // Neighbors from edges
  const neighbors = [];
  RAW.edges.forEach(e => {
    if (e.source === node.id) {
      const t = RAW.nodes.find(n => n.id === e.target);
      if (t) neighbors.push(t);
    } else if (e.target === node.id) {
      const s = RAW.nodes.find(n => n.id === e.source);
      if (s) neighbors.push(s);
    }
  });
  const uniq = Array.from(new Map(neighbors.map(n => [n.id, n])).values()).slice(0, 40);
  const nbEl = document.getElementById('p-neighbors');
  if (uniq.length === 0) {
    nbEl.innerHTML = '<span style="color:rgba(242,237,228,.35);font-size:11px">No inbound or outbound links.</span>';
  } else {
    nbEl.innerHTML = uniq.map(n =>
      `<span class="n-chip" data-id="${n.id}">${n.label}</span>`
    ).join('');
    nbEl.querySelectorAll('.n-chip').forEach(chip => {
      chip.onclick = () => {
        const target = RAW.nodes.find(n => n.id === chip.dataset.id);
        if (target && GRAPH) {
          // Find internal node ref
          const gNode = GRAPH.graphData().nodes.find(n => n.id === target.id);
          if (gNode) {
            showPanel(gNode);
            const dr = 1 + 140 / Math.hypot(gNode.x || 1, gNode.y || 1, gNode.z || 1);
            GRAPH.cameraPosition(
              { x: (gNode.x || 0) * dr, y: (gNode.y || 0) * dr, z: (gNode.z || 0) * dr },
              gNode,
              1000
            );
          }
        }
      };
    });
  }
  document.getElementById('panel').classList.add('on');
}

window.clearSel = function() {
  SEL = null;
  document.getElementById('panel').classList.remove('on');
};

// ── GLOW TEXTURE ───────────────────────────────────────────
let _glowTexture = null;
function getGlowTexture() {
  if (_glowTexture) return _glowTexture;
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  grad.addColorStop(0.00, 'rgba(255,255,255,1)');
  grad.addColorStop(0.15, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.35)');
  grad.addColorStop(0.65, 'rgba(255,255,255,0.08)');
  grad.addColorStop(1.00, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  _glowTexture = new THREE.CanvasTexture(canvas);
  _glowTexture.needsUpdate = true;
  return _glowTexture;
}

// Handle resize
window.addEventListener('resize', () => {
  if (GRAPH) {
    GRAPH.width(window.innerWidth).height(window.innerHeight);
  }
});
</script>

</body>
</html>
